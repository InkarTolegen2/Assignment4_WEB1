<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Registration</h1>

    <form id="registerForm" novalidate>
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" required minlength="2">
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">First name is required.</div>
            </div>

            <div class="col-md-6">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" required minlength="2">
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Last name is required.</div>
            </div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Valid email is required.</div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required minlength="8">
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Password is required (min 8 characters).</div>
            </div>

            <div class="col-md-6">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" required>
                <div class="valid-feedback">Passwords match!</div>
                <div class="invalid-feedback">Passwords do not match.</div>
            </div>
        </div>

        <h4>Gender</h4>
        <div class="mb-3">
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
                <label class="form-check-label" for="male">Male</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="female" value="female" required>
                <label class="form-check-label" for="female">Female</label>
            </div>
        </div>

        <h4>Hobbies</h4>
        <div class="mb-3">
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="hobbies" id="music" value="music">
                <label class="form-check-label" for="music">Music</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="hobbies" id="sports" value="sports">
                <label class="form-check-label" for="sports">Sports</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="hobbies" id="reading" value="reading">
                <label class="form-check-label" for="reading">Reading</label>
            </div>
        </div>

        <div class="mb-3">

            <select class="form-select mb-3" id="country" required>
                <option value="">Select Country</option>
                <option value="Kazakhstan">Kazakhstan</option>
                <option value="Canada">Canada</option>
                <option value="UK">UK</option>
            </select>

            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Country selection is required.</div>
        </div>
    
        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="reset" class="btn btn-secondary">Reset</button>
    </form>
</div>

<script src="register.js"></script>
</body>
</html>
